[package]
name = "PavlovReplayToolbox"
version = "0.1.10"
edition = "2021"

[dependencies]
eframe = "0.31.1"
egui = "0.31.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.150"
chrono = "0.4.44"
rfd = "0.17.2"
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
image = "0.25.10"
directories = "6.0.0"
rayon = "1.12.0"
open = "5.3.5"

[build-dependencies]
image = "0.25.6"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"